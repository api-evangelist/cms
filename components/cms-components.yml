summary: >-
  CMS publishes a first-party, open-source, Section 508-compliant React and Sass component library —
  the CMS Design System — plus three child design systems themed for CMS.gov, Medicare.gov and
  HealthCare.gov. These are client-side UI components a developer embeds in their own product, which is
  what makes them Components rather than SDKs. There are no embeddable hosted widgets, no prebuilt
  iframes, and no embedded dashboards: CMS ships the building blocks, not a drop-in surface.
