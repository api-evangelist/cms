generated: '2026-08-15'
method: searched
source: >-
  https://api.bluebutton.cms.gov/v2/fhir/metadata (FHIR R4 CapabilityStatement, saved verbatim),
  https://sandbox.dpc.cms.gov/api/v1/metadata (FHIR STU3 CapabilityStatement, saved verbatim),
  https://api.bluebutton.cms.gov/.well-known/openid-configuration,
  https://bluebutton.cms.gov/api-documentation/authorization/,
