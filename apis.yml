apis:
- name: CMS Beneficiary Claims Data API (BCDA)
  description: >-
    Enables Medicare Accountable Care Organizations (ACOs) and alternative payment model participants
    to retrieve Medicare Part A, B, and D claims data for their attributed enrollees. Implements the HL7
    Bulk FHIR Implementation Guide and delivers NDJSON formatted claims data updated at least weekly.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://bcda.cms.gov/
  baseURL: https://bcda.cms.gov
  tags:
  - Medicare
  - ACO
  - Claims Data
  - FHIR
  - Bulk Data
  - Part A
  - Part B
  - Part D
  properties:
  - type: Documentation
    url: https://bcda.cms.gov/api-documentation.html
  - type: GitHubRepository
    url: https://github.com/CMSgov/bcda-app
  contact:
  - FN: BCDA Developer Community
    url: https://groups.google.com/g/bc-api
- name: CMS AB2D API (Claims Data to Part D Sponsors)
  description: >-
    Enables stand-alone Medicare Part D Prescription Drug Plan sponsors to retrieve bulk Medicare Part
    A and B claims data for their active beneficiaries using the FHIR standard in NDJSON format. Authenticates
    via Okta-based OAuth 2.0 bearer tokens.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://ab2d.cms.gov/
  baseURL: https://api.ab2d.cms.gov
  tags:
  - Medicare
  - Part D
  - Claims Data
  - FHIR
  - Bulk Data
  - Prescription Drug Plans
  properties:
  - type: Documentation
    url: https://ab2d.cms.gov/api-documentation
  - type: AdvancedGuide
    url: https://ab2d.cms.gov/advanced-user-guide.html
- name: CMS Data at the Point of Care (DPC) API
  description: >-
    Provides Original Medicare claims data to fee-for-service Medicare providers in a structured, standardized
    FHIR format at the point of care. Helps providers gain complete views of patient medical histories
    to improve care coordination and reduce redundant testing.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dpc.cms.gov/
  baseURL: https://sandbox.dpc.cms.gov
  tags:
  - Medicare
  - FHIR
  - Provider
  - Point of Care
  - Claims Data
  - Care Coordination
  properties:
  - type: Documentation
    url: https://dpc.cms.gov/docsV1
  - type: GitHubRepository
    url: https://github.com/CMSgov/dpc-app
  contact:
  - FN: DPC API Developer Group
    url: https://groups.google.com/d/forum/dpc-api
- name: CMS Finder API
  description: >-
    The API behind Finder.Healthcare.gov that helps users find private health plans available outside
    the Health Insurance Marketplace. Supports individual plan lookups, small group plan searches, and
    geographic lookups by ZIP code. Rate limited to 1000 requests per minute.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.cms.gov/finder-api/
  baseURL: https://finder.healthcare.gov
  tags:
  - Health Insurance
  - Plan Finder
  - Individual Plans
  - Small Group Plans
  - Healthcare.gov
  properties:
  - type: Documentation
    url: https://finder.healthcare.gov/#services
  - type: Authentication
    url: https://developer.cms.gov/finder-api/key-request.html
- name: CMS Quality Payment Program (QPP) Submissions API
  description: >-
    Enables QPP participants to submit quality performance data and receive real-time performance scoring
    feedback. Supports Merit-based Incentive Payment System (MIPS) and Advanced Alternative Payment Model
    (APM) data submissions for Medicare quality reporting.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://cmsgov.github.io/qpp-submissions-docs/
  baseURL: https://qpp.cms.gov/api
  tags:
  - Quality Payment Program
  - QPP
  - MIPS
  - APM
  - Medicare Quality
  - Performance Scoring
  properties:
  - type: Documentation
    url: https://cmsgov.github.io/qpp-submissions-docs/
