aid: cms
name: Centers for Medicare and Medicaid Services
description: The Centers for Medicare and Medicaid Services (CMS) provides a suite of public REST APIs
  enabling developers to access Medicare provider data, quality measures, drug spending, health plan finder,
  beneficiary claims, and public health insurance datasets. CMS APIs support interoperability standards
  including HL7 FHIR and OAuth 2.0 to power healthcare applications across the US health system.
type: Index
accessModel:
  pricing: free
  onboarding: open
  trial: false
  try_now: true
  public: true
  label: Free · Open access
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cms.png
url: https://raw.githubusercontent.com/api-evangelist/cms/refs/heads/main/apis.yml
created: '2026-06-13'
modified: '2026-06-13'
specificationVersion: '0.19'
