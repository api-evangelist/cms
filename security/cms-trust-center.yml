  note: >-
    security.cms.gov is CMS's public information security and privacy program site. It is a federal
    authorization portal rather than a commercial trust centre — it documents the authorization
    lifecycle every CMS system (including these APIs) must pass, not a set of purchased attestations.
    Read it as the CMS equivalent of a trust page, and do not expect SOC 2 or ISO 27001: US federal
    agencies operate FISMA/FedRAMP authorization instead.
