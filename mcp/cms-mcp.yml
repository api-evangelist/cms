search_note: >-
  SEARCHED and found nothing. There is no CMS-published MCP server. The CMSgov GitHub organization has
  no MCP repository; the npm registry returns no @cmsgov or CMS-maintained MCP package; nothing on
  developer.cms.gov, bluebutton.cms.gov, bcda.cms.gov, ab2d.cms.gov, dpc.cms.gov or data.cms.gov
  advertises an MCP endpoint; and no probed host serves /.well-known/ai-plugin.json or an agent card
  that could point at one. Third-party MCP servers wrapping Medicare data exist on npm
  (@pipeworx/mcp-medicare-coverage, @mymedi-ai/mcp-server) but they are NOT CMS products and are
  deliberately excluded — listing them here would credit CMS with an agent surface it does not ship.
  The tools[] below are therefore a DERIVED candidate mapping of existing REST operations, not a
  server anyone can call.
deployment:
  mode: none
  auth: unknown
  verified: derived
  note: >-
    No hosted endpoint and no installable package exist. mode is none because CMS ships nothing; the
    endpoint and install fields are deliberately left empty rather than guessed.
