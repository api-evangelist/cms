agent_readiness_note: >-
  Every tool above is a bulk, asynchronous, consent- or attribution-gated data export governed by
  federal privacy rules. If CMS ever builds an MCP server, the export-start operations are the ones
  that need explicit escalation semantics — they return PHI for whole attributed populations, not a
  single record. See agentic-access/cms-agentic-access.yml.
