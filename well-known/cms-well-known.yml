security_txt:
  served: false
  note: >-
    No CMS or HHS host in scope serves /.well-known/security.txt. CMS does publish a vulnerability
    disclosure policy as an HTML page at https://www.cms.gov/vulnerability-disclosure-policy and links
    it from the footer of every API developer site — captured in
    security/cms-vulnerability-disclosure.yml — but it is not exposed as an RFC 9116 document, so no
    SecurityTxt pointer is emitted.
agent_card:
  found: false
  note: >-
    Probed /.well-known/agent-card.json and the legacy /.well-known/agent.json on all sixteen hosts.
    Every 200 was an SPA HTML shell, never a JSON AgentCard object. No a2a/ artifact was written and no
    AgentCard pointer is emitted.
