generated: '2026-08-15'
method: probed
source: live HTTPS probes of every apis.yml baseURL host, every OpenAPI servers[] host, and the CMS docs/portal hosts
summary: >-
  Sixteen CMS / HHS hosts were probed for the RFC 8615 discovery surface. Only the Blue Button 2.0 FHIR
  hosts serve a real document: an OpenID Connect discovery document at
  /.well-known/openid-configuration on both production (api.bluebutton.cms.gov) and sandbox
  (sandbox.bluebutton.cms.gov). No CMS host serves an RFC 9116 security.txt, an api-catalog, an
  ai-plugin.json, an OAuth authorization-server or protected-resource metadata document, an llms.txt,
  or an A2A agent card. Three hosts (qpp.cms.gov, data.cms.gov, npiregistry.cms.hhs.gov) are
  single-page applications whose catch-all route answers HTTP 200 with an HTML shell for every
  /.well-known/* path — those are recorded as html-shell, NOT as documents.
hosts:
  - host: https://api.bluebutton.cms.gov
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: cms-bluebutton-openid-configuration.json
        note: >-
          Real OIDC discovery document. issuer https://api.bluebutton.cms.gov; authorization_endpoint
          /v2/o/authorize; token_endpoint /v2/o/token; revocation_endpoint /v2/o/revoke_token;
          userinfo_endpoint /v2/connect/userinfo; grant_types_supported [refresh_token,
          authorization_code]; carries a SMART-on-FHIR fhir_metadata_uri pointing at
          https://api.bluebutton.cms.gov/v2/fhir/metadata.
      - path: /.well-known/security.txt
        status: 404
      - path: /.well-known/oauth-authorization-server
