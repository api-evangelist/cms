        in: path
        description: A contract number
        required: true
        schema:
          type: string
          minLength: 1
        example: Z0000
      - name: _type
        in: query
        description: String of comma-delimited FHIR resource objects. Only resources of the specified resource types(s) SHALL
          be included in the response. Currently, only ExplanationOfBenefit objects are supported
        required: false
        schema:
          type: string
          enum:
          - ExplanationOfBenefit
      - name: _outputFormat
        in: query
        description: The format for the requested bulk data files to be generated. Currently, only application/fhir+json is
          supported.
        required: false
        schema:
          type: string
          enum:
          - application/fhir+ndjson
          - application/ndjson
          - ndjson
      - name: _since
        in: query
        description: Beginning time of query. Returns all records "since" this time. At this time, it must be after 2020-02-13T00:00:00.000-05:00
        required: false
        schema:
          type: date-time
        example: '2020-02-13T00:00:00.000-05:00'
      - name: _until
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: Prefer
        in: header
        description: Value must be respond-async
        required: true
        schema:
          type: string
          default: respond-async
          enum:
          - respond-async
      responses:
        '202':
          description: Export request has started
          headers:
            Content-Location:
              description: Absolute URL of an endpoint for subsequent status requests (polling location)
              style: simple
              schema:
                type: string
        '429':
          description: Too many jobs are currently running. Either wait for currently running jobs to finish or cancel some/all
            of those jobs.
          headers:
            Content-Location:
              description: URLs of currently running jobs. To cancel one of those jobs, invoke the Status DELETE call.
              style: simple
              schema:
                type: string
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
      deprecated: true
  /api/v1/admin/client/{contractNumber}:
    get:
      tags:
      - admin-api
      operationId: getClient
      parameters:
      - name: contractNumber
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpClientDTO'
components:
  schemas:
    ContractDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contractNumber:
          type: string
        contractName:
          type: string
        attestedOn:
          type: string
          format: date-time
        contractType:
          type: string
          enum:
          - NORMAL
          - CLASSIC_TEST
          - SYNTHEA
        totalEnrollment:
          type: integer
          format: int32
        medicareEligible:
          type: integer
          format: int32
      required:
      - contractName
      - contractNumber
      - id
    PdpClientDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        clientId:
          type: string
        organization:
          type: string
        enabled:
          type: boolean
        role:
          type: string
        contract:
          $ref: '#/components/schemas/ContractDTO'
      required:
      - clientId
      - enabled
      - organization
    MaintenanceModeResponse:
      type: object
      properties:
        maintenanceMode:
          type: string
    FileMetadata:
      type: object
      properties:
        url:
          type: string
        valueString:
          type: string
        valueDecimal:
          type: integer
          format: int64
    JobCompletedResponse:
      type: object
      properties:
        transactionTime:
          type: string
        request:
          type: string
        requiresAccessToken:
          type: boolean
        output:
          type: array
          items:
            $ref: '#/components/schemas/Output'
        error:
          type: array
          items:
            $ref: '#/components/schemas/Output'
    Output:
      type: object
      properties:
        type:
          type: string
        url:
          type: string
        extension:
          type: array
          items:
            $ref: '#/components/schemas/FileMetadata'
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
