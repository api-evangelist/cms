components:
  schemas:
    JobStatus:
      type: string
      x-go-package: github.com/CMSgov/bcda-app/bcda/models
    EntryResponse:
      type: object
      properties:
        resource:
          type: object
          properties:
            ExecutionPeriod:
              type: object
              properties:
                end:
                  description: Time job completed
                  type: string
                  format: date-time
                  x-go-name: End
                start:
                  description: Time job started
                  type: string
                  format: date-time
                  x-go-name: Start
            identifier:
              type: object
              properties:
                system:
                  description: Url for jobs statuses
                  type: string
                  x-go-name: System
                use:
                  description: Official
                  type: string
                  x-go-name: Use
                value:
                  description: Job Id
                  type: string
                  x-go-name: Value
              x-go-name: Identifier
            input:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: object
                    properties:
                      text:
                        description: BULK FHIR Export
                        type: string
                        x-go-name: Text
                    x-go-name: Type
                  valueString:
                    description: Original job request url
                    type: string
                    x-go-name: ValueString
              x-go-name: Input
            intent:
              description: Order
              type: string
              x-go-name: Intent
            resourceType:
              description: Task
              type: string
              x-go-name: ResourceType
            status:
              description: Job Status
              type: string
              x-go-name: Status
          x-go-name: Resource
      x-go-package: github.com/CMSgov/bcda-app/bcda/models
    fileItem:
      type: object
      properties:
        type:
          description: FHIR resource type of file contents
          type: string
          x-go-name: Type
        url:
          description: URL of the file
          type: string
          x-go-name: URL
      x-go-name: FileItem
      x-go-package: github.com/CMSgov/bcda-app/bcda/api
    BulkResponseBody:
      type: object
      properties:
        JobID:
          type: integer
          format: uint64
        error:
          description: Information about error files, including URLs for downloading
          type: array
          items:
            $ref: '#/components/schemas/fileItem'
          x-go-name: Errors
        output:
          description: Information about generated data files, including URLs for downloading
          type: array
          items:
            $ref: '#/components/schemas/fileItem'
          x-go-name: Files
        request:
          description: URL of the bulk data export request
          type: string
          x-go-name: RequestURL
        requiresAccessToken:
          description: Indicates whether an access token is required to download generated data files
          type: boolean
          x-go-name: RequiresAccessToken
        transactionTime:
          description: Server time when the query was run
          type: string
          format: date-time
          x-go-name: TransactionTime
      x-go-package: github.com/CMSgov/bcda-app/bcda/api
    BundleResponse:
      type: object
      properties:
        entry:
          type: array
          items:
            $ref: '#/components/schemas/EntryResponse'
          x-go-name: Entry
        resourceType:
          description: Bundle
          type: string
          x-go-name: ResourceType
        total:
          description: Total number of entries
          type: integer
          format: int64
          x-go-name: Total
        type:
          description: Searchset
          type: string
          x-go-name: Type
      x-go-package: github.com/CMSgov/bcda-app/bcda/models
    OperationOutcomeResponse:
      type: object
      properties:
        Issue:
          type: object
          required:
          - Severity
          - Code
          - Diagnostics
          properties:
            Severity:
              description: 'Severity of the outcome: fatal | error | warning | information'
              type: string
            Code:
              description: Error or warning code
              type: string
            Diagnostics:
              description: Additional diagnostic information about the issue
              type: string
      x-go-package: github.com/CMSgov/bcda-app/bcda/models
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
    bearer_token:
      type: apiKey
      description: The Group and Patient endpoints require a Bearer Token. 1) Put your credentials in Basic Authentication, 2) Request a bearer token from /auth/token, 3) Put "Bearer {TOKEN}" in this field (no quotes) using the bearer token retrieved in step 2
      name: Authorization
      in: header
x-original-swagger-version: '2.0'
