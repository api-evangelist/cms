    enum:
    - CSR73
    - CSR87
    - CSR94
    - LimitedCSR
    - ZeroCSR
  Issuer:
    properties:
      eligible_dependents:
        description: list of allowed relationship types for dependents
        items:
          $ref: '#/definitions/Relationship'
        type: array
      id:
        description: 5-digit HIOS ID
        type: string
      individual_url:
        description: URL for individual market plans
        type: string
      name:
        description: issuer's name
        type: string
      shop_url:
        description: URL for SHOP market plans
        type: string
      state:
        description: 2-letter USPS state abbreviation
        type: string
      toll_free:
        description: toll-free customer service phone number
        type: string
      tty:
        description: TTY customer service number)
        type: string
    type: object
  CurrentEnrollment:
    description: Current/existing enrollment information used to determine tobacco status for CiC enrollments. This will ensure rate calculation is done correctly.
    required:
    - plan_id
    - effective_date
    - uses_tobacco
    properties:
      plan_id:
        $ref: '#/definitions/PlanID'
      effective_date:
        description: Date plan went into effect (ISO-8601 YYYY-MM-DD)
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        x-example: '2020-01-01'
      uses_tobacco:
        type: boolean
    type: object
  ProductDivisionEnum:
    enum:
    - HealthCare
    - Dental
    type: string
  UtilizationEnum:
    enum:
    - Low
    - Medium
    - High
    type: string
  MarketEnum:
    enum:
    - Individual
    - SHOP
    - Any
    type: string
    properties: {}
  Relationship:
    description: Should match one of the [listed valid relationships](#introduction/more-information-about-households).
    type: string
    properties: {}
  Place:
    properties:
      countyfips:
        description: 5-digit county FIPS code
        type: string
      state:
        description: 2-letter USPS state abbreviation
        type: string
      zipcode:
        description: 5-digit ZIP Code
        type: string
    required:
    - countyfips
    - state
    - zipcode
    example:
      countyfips: '51107'
      state: VA
      zipcode: '20103'
    type: object
  PlanID:
    type: string
    pattern: ^[0-9]{5}[A-Z]{2}[0-9]{7}$
    properties: {}
  InsuranceMarketEnum:
    enum:
    - QHP
    - MSP
    type: string
    properties: {}
  NetworkTierEnum:
    enum:
    - In-Network
    - In-Network Tier 2
    - Out-of-Network
    - Combined In-Out of Network
    type: string
    properties: {}
  CertificationStatus:
    type: string
    enum:
    - Certified
    - Not Certified
    - Decertified
    - Certified Off-Exchange SADP
  CostSharing:
    properties:
      coinsurance_options:
        type: string
      coinsurance_rate:
        format: float
        type: number
      copay_amount:
        type: number
      copay_options:
        type: string
      network_tier:
        $ref: '#/definitions/NetworkTierEnum'
      csr:
        $ref: '#/definitions/CostSharingReductionEnum'
      display_string:
        type: string
    type: object
  CostSharingReductionEnum:
    type: string
    description: Cost-sharing reduction (CSR)
    enum:
    - Exchange variant (no CSR)
    - Zero Cost Sharing Plan Variation
    - Limited Cost Sharing Plan Variation
    - 73% AV Level Silver Plan CSR
    - 87% AV Level Silver Plan CSR
    - 94% AV Level Silver Plan CSR
    - Non-Exchange variant
    - Unknown CSR
    properties: {}
  Benefit:
    properties:
      name:
        type: string
      covered:
        type: boolean
      cost_sharings:
        items:
          $ref: '#/definitions/CostSharing'
        type: array
      explanation:
        type: string
      exclusions:
        type: string
      has_limits:
        type: boolean
      limit_unit:
        type: string
      limit_quantity:
        format: integer
        type: number
    type: object
  Household:
    description: If a household is not included, will default to Individual household
    properties:
      income:
        description: household's yearly income in dollars
        format: float
        type: number
      unemployment_received:
        description: Specifies whether a tax payer or tax dependent in the household received unemployment benefits for market year 2021. May affect ATPC and CSR calulations due to income percentage capping if income is above 133% of the Federal poverty level. If the person who received unemployment is a tax dependent, only the eligible CSRs will be affected. Defaults to None
        enum:
        - Adult
        - Dependent
        - None
        type: string
      people:
        description: people in household applying for coverage/seeking eligibility esimate; first is considered the subscriber
        items:
          $ref: '#/definitions/Person'
        type: array
      has_married_couple:
        type: boolean
      effective_date:
        description: The effective date of the application (YYYY-MM-DD)
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    example:
      income: 20000
      people:
      - age: 34
        dob: '1984-01-06'
        is_pregnant: false
        is_parent: false
        uses_tobacco: false
        gender: Male
      has_married_couple: false
    type: object
